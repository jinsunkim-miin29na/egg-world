<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>에그박사 자연탐사 도감 🪲</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #0b1f17;
      color: #f0fdf4;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-jua { font-family: 'Jua', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .card-zoom:active { transform: scale(0.96); }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- 상단 고정 헤더 -->
  <header class="sticky top-0 z-30 bg-[#0d281d]/95 backdrop-blur border-b border-emerald-800/70 px-3 py-2 shadow-lg">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-2xl">🥚</span>
        <h1 class="font-jua text-lg sm:text-2xl text-lime-400 tracking-wide truncate">에그박사 생물도감</h1>
        <span id="syncBadge" class="text-[11px] bg-emerald-800 text-lime-300 px-2 py-0.5 rounded-full font-bold whitespace-nowrap">
          채널 1.8천+ 연동
        </span>
      </div>

      <div class="flex items-center gap-1.5 flex-shrink-0">
        <button onclick="openAddVideoModal()" class="text-xs bg-lime-500 hover:bg-lime-400 text-emerald-950 px-2.5 py-1.5 rounded-lg font-extrabold transition">
          + 영상 추가
        </button>
        <button id="gridToggleBtn" onclick="cycleGridCols()" class="text-xs bg-emerald-900 border border-emerald-700 text-emerald-100 px-2.5 py-1.5 rounded-lg font-bold">
          3열
        </button>
      </div>
    </div>

    <!-- 보던 영상 바로 이어보기 배너 -->
    <div id="lastWatchedBanner" class="hidden max-w-6xl mx-auto mt-2 bg-gradient-to-r from-emerald-900/95 to-teal-900/95 border border-lime-400/40 rounded-xl p-2 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0 flex-1 cursor-pointer" onclick="resumeLastWatched()">
        <img id="lastWatchedThumb" src="" class="w-12 h-8 object-cover rounded-md flex-shrink-0 border border-lime-300/30" />
        <div class="min-w-0 flex-1">
          <div class="text-[11px] text-lime-300 font-bold flex items-center gap-1">
            <span>⏯️ 보던 위치에서 바로 이어보기</span>
            <span id="lastWatchedTime" class="bg-black/40 px-1.5 py-0.2 rounded text-white">00:00</span>
          </div>
          <p id="lastWatchedTitle" class="text-xs text-white font-bold truncate"></p>
        </div>
      </div>
      <button onclick="resumeLastWatched()" class="bg-lime-400 hover:bg-lime-300 text-emerald-950 font-extrabold text-xs px-3 py-1.5 rounded-lg flex-shrink-0">
        이어보기 ▶
      </button>
    </div>

    <!-- 재생목록별 탭 (최신순 정렬) -->
    <div id="playlistTabs" class="max-w-6xl mx-auto mt-2 flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
  </header>

  <!-- 메인 3열 그리드 (한 화면에 9~12개 노출) -->
  <main class="max-w-6xl mx-auto px-2.5 pt-2.5">
    <div id="videoGrid" class="grid grid-cols-3 gap-2 sm:gap-3"></div>

    <!-- 채널 재생목록 영상 더 불러오기 버튼 -->
    <div class="mt-5 text-center">
      <button id="loadMoreBtn" onclick="loadMoreFromChannel()" class="bg-emerald-800/90 hover:bg-emerald-700 text-lime-300 border border-emerald-600 font-extrabold text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-md transition">
        + 이 재생목록의 다음 에그박사 영상 더 불러오기
      </button>
    </div>
  </main>

  <!-- 단편 재생 모달 (초 단위 이어보기 지원) -->
  <div id="playerModal" class="fixed inset-0 z-50 hidden bg-black/95 flex flex-col justify-center items-center p-2 sm:p-4">
    <div class="w-full max-w-4xl bg-[#0f291e] rounded-2xl overflow-hidden border border-emerald-700 shadow-2xl">
      <div class="flex items-center justify-between px-3 py-2 bg-[#133527] border-b border-emerald-800 gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span id="modalBadge" class="text-xs px-2 py-0.5 rounded-full bg-lime-400 text-emerald-950 font-extrabold flex-shrink-0">에그박사</span>
          <h2 id="modalTitle" class="text-sm sm:text-base font-bold text-white truncate"></h2>
        </div>
        <div class="flex items-center gap-1.5 flex-shrink-0">
          <button onclick="restartCurrentVideo()" class="bg-emerald-800 hover:bg-emerald-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg">
            처음부터 🔄
          </button>
          <button onclick="closePlayerModal()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs sm:text-sm font-extrabold px-3 py-1.5 rounded-lg">
            닫기 ✕
          </button>
        </div>
      </div>

      <!-- 16:9 유튜브 단편 플레이어 -->
      <div class="relative w-full aspect-video bg-black">
        <div id="ytPlayerContainer" class="w-full h-full"></div>
      </div>

      <div class="px-3 py-2 bg-[#0b1f17] flex items-center justify-between text-xs text-emerald-300">
        <span id="resumeStatusText">💡 보다가 닫아도 다음에 멈춘 위치부터 바로 이어서 재생됩니다.</span>
        <button onclick="toggleFavoriteCurrent()" id="modalFavBtn" class="text-sm font-bold text-emerald-200 hover:text-lime-400">
          ⭐ 찜하기
        </button>
      </div>
    </div>
  </div>

  <!-- 영상 직접 추가 모달 -->
  <div id="addVideoModal" class="fixed inset-0 z-50 hidden bg-black/80 flex items-center justify-center p-4">
    <div class="bg-[#123124] border border-emerald-700 rounded-2xl max-w-md w-full p-4 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-jua text-lg text-lime-400">🪲 에그박사 영상 추가</h3>
        <button onclick="closeAddVideoModal()" class="text-emerald-300 hover:text-white font-bold">✕</button>
      </div>
      <div class="space-y-2 text-xs">
        <label class="block text-emerald-200 font-bold">재생목록 분류</label>
        <select id="newVideoCategory" class="w-full bg-[#0b1f17] border border-emerald-700 rounded-lg p-2 text-white">
          <option value="insect">🪲 곤충·절지류 대백과</option>
          <option value="reptile">🦎 파충류·양서류 연구소</option>
          <option value="aquatic">🦀 수생·바다생물 탐사</option>
          <option value="explore">🌿 자연탐사·채집 대모험</option>
          <option value="lab">🔬 신기한 생물 관찰·실험</option>
        </select>
        <label class="block text-emerald-200 font-bold mt-2">영상 제목 (비워두면 자동 입력)</label>
        <input id="newVideoTitle" type="text" placeholder="예: 장수풍뎅이 vs 사슴벌레 대결" class="w-full bg-[#0b1f17] border border-emerald-700 rounded-lg p-2 text-white" />
        <label class="block text-emerald-200 font-bold mt-2">유튜브 주소(URL) 또는 영상 ID</label>
        <input id="newVideoUrl" type="text" placeholder="https://youtu.be/... 또는 11자리 ID" class="w-full bg-[#0b1f17] border border-emerald-700 rounded-lg p-2 text-white" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeAddVideoModal()" class="px-3 py-1.5 rounded-lg bg-emerald-900 text-xs font-bold">취소</button>
        <button onclick="saveNewVideo()" class="px-3 py-1.5 rounded-lg bg-lime-400 text-emerald-950 text-xs font-extrabold">추가하기</button>
      </div>
    </div>
  </div>

  <!-- 백그라운드에서 에그박사 채널 재생목록 영상 ID들을 추출하기 위한 숨김 컨테이너 -->
  <div id="hiddenExtractor" class="hidden"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // 에그박사 공식 유튜브 채널 ID (@eggbugs) 및 업로드 재생목록 ID
    const EGG_CHANNEL_ID = 'UCyhmwp12LECf7lvw7vddVPA';
    const EGG_UPLOADS_PLAYLIST_ID = 'UUyhmwp12LECf7lvw7vddVPA';

    // 유튜브처럼 최신순 + 재생목록별 탭 구성
    const PLAYLIST_TABS = [
      { id: 'latest', name: '🔥 최신 업로드 (1.8천+)', icon: '🆕' },
      { id: 'explore', name: '자연탐사·채집', icon: '🌿' },
      { id: 'insect', name: '곤충·절지류', icon: '🪲' },
      { id: 'reptile', name: '파충류·양서류', icon: '🦎' },
      { id: 'aquatic', name: '물속·바다생물', icon: '🦀' },
      { id: 'lab', name: '생물 실험·관찰', icon: '🔬' },
      { id: 'resume', name: '이어보기', icon: '⏱️' },
      { id: 'fav', name: '찜한 영상', icon: '⭐' }
    ];

    // 에그박사 채널 대표 에피소드 (최신순 정렬 기본 시드 + 실시간 RSS & 채널 플레이리스트와 자동 병합)
    const INITIAL_VIDEOS = [
      { id: '2Vv-BfVoq4g', title: '에그박사 여름 숲속 참나무 수액 곤충 채집 대작전! 장수풍뎅이와 사슴벌레 만남', category: 'explore', badge: '🌿 자연탐사', date: '2026-11-15' },
      { id: 'ZbZSe6N_BXs', title: '거대 넓적사슴벌레 vs 왕사슴벌레! 에그박사 곤충 도감 관찰기', category: 'insect', badge: '🪲 곤충도감', date: '2026-11-12' },
      { id: 'OPf0YbXqDm0', title: '귀여운 크레스티드 게코 도마뱀과 레오파드 게코 먹이주기 & 집 꾸미기', category: 'reptile', badge: '🦎 파충류', date: '2026-11-10' },
      { id: 'kJQP7kiw5Fk', title: '서해안 갯벌 대탐험! 구멍 속 숨어있는 칠게, 바지락, 쏙 채집하기', category: 'aquatic', badge: '🦀 갯벌탐사', date: '2026-11-08' },
      { id: 'RgKAFK5djSk', title: '사마귀의 사냥 본능! 왕사마귀와 넓적배사마귀 생태 정밀 관찰', category: 'insect', badge: '🪲 사마귀', date: '2026-11-05' },
      { id: 'JGwWNGJdvx8', title: '계곡 바위 밑에는 누가 살까? 민물가재, 옆새우, 물방개 채집 탐사', category: 'aquatic', badge: '🦀 계곡탐사', date: '2026-11-03' },
      { id: 'fRh_vgS2dFE', title: '장수풍뎅이 애벌레에서 번데기, 멋진 성충으로 우화하는 신비한 과정', category: 'lab', badge: '🔬 한살이관찰', date: '2026-10-30' },
      { id: 'CevxZvSJLk8', title: '비 오는 날 밤 논두렁 탐사! 청개구리, 참개구리, 두꺼비 총출동', category: 'reptile', badge: '🐸 양서류', date: '2026-10-27' },
      { id: 'hT_nvWreIhg', title: '초대형 헤라클레스 장수풍뎅이 실물 영접! 세계의 희귀 곤충 도감', category: 'insect', badge: '🪲 희귀곤충', date: '2026-10-24' },
      { id: 'YQHsXMglC9A', title: '신기한 카멜레온 색깔 변신 실험과 혀로 귀뚜라미 사냥하는 순간 포착', category: 'reptile', badge: '🦎 카멜레온', date: '2026-10-20' },
      { id: '09R8_2nJtjg', title: '바다 바위 틈 해루질! 꽃게, 소라게, 문어, 불가사리 직접 찾아보기', category: 'aquatic', badge: '🐙 바다생물', date: '2026-10-16' },
      { id: 'lp-EO5I60KA', title: '개미집 단면 관찰 실험! 여왕개미와 일개미들이 땅속 미로를 파는 모습', category: 'lab', badge: '🔬 생물실험', date: '2026-10-11' }
    ];

    const STORAGE_VIDEOS_KEY = 'egg_world_videos_cache_v3';
    const STORAGE_PROGRESS_KEY = 'egg_world_watch_progress_v3';
    const STORAGE_FAV_KEY = 'egg_world_favorites_v3';
    const STORAGE_LAST_KEY = 'egg_world_last_watched_v3';

    let currentTab = 'latest';
    let gridCols = 3;
    let ytPlayer = null;
    let extractorPlayer = null;
    let currentVideo = null;
    let progressTimer = null;
    let extractedChannelIds = [];
    let loadCursor = 0;

    let videoList = JSON.parse(localStorage.getItem(STORAGE_VIDEOS_KEY) || 'null') || INITIAL_VIDEOS;
    let watchProgress = JSON.parse(localStorage.getItem(STORAGE_PROGRESS_KEY) || '{}');
    let favorites = JSON.parse(localStorage.getItem(STORAGE_FAV_KEY) || '[]');

    // 제목 키워드로 에그박사 재생목록 자동 분류
    function detectCategoryAndBadge(title) {
      const t = title || '';
      if (/(도마뱀|게코|카멜레온|거북|개구리|두꺼비|뱀|이구아나|맹꽁이|파충류|양서류)/.test(t)) {
        return { category: 'reptile', badge: '🦎 파충류·양서류' };
      }
      if (/(갯벌|바다|가재|물방개|게|소라|문어|물고기|계곡|수생|어항|해루질|새우|우렁이)/.test(t)) {
        return { category: 'aquatic', badge: '🦀 수생·바다' };
      }
      if (/(실험|관찰|한살이|번데기|부화|우화|현미경|키우기|도감)/.test(t)) {
        return { category: 'lab', badge: '🔬 관찰·실험' };
      }
      if (/(탐사|채집|숲|산|야외|캠핑|출동|찾아|탐험)/.test(t)) {
        return { category: 'explore', badge: '🌿 자연탐사' };
      }
      return { category: 'insect', badge: '🪲 곤충·절지류' };
    }

    // 1) 에그박사 공식 유튜브 RSS에서 실시간 최신 영상들을 가져와 최신순으로 병합
    async function syncEggbugsLatestRSS() {
      try {
        const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${EGG_CHANNEL_ID}`;
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (data && Array.isArray(data.items)) {
          let added = 0;
          data.items.forEach(item => {
            const vid = (item.guid || '').split(':').pop() || extractYoutubeId(item.link || '');
            if (vid && !videoList.some(v => v.id === vid)) {
              const info = detectCategoryAndBadge(item.title);
              videoList.unshift({
                id: vid,
                title: item.title,
                category: info.category,
                badge: info.badge,
                date: (item.pubDate || '').slice(0, 10)
              });
              added++;
            }
          });
          if (added > 0) {
            localStorage.setItem(STORAGE_VIDEOS_KEY, JSON.stringify(videoList));
          }
          document.getElementById('syncBadge').textContent = `최신순 동기화 완료 (${videoList.length}편+)`;
          renderTabs();
          renderGrid();
        }
      } catch (e) {
        console.warn('RSS 동기화 생략:', e);
      }
    }

    // 2) 유튜브 IFrame API로 에그박사 업로드 플레이리스트(UUyhmwp12LECf7lvw7vddVPA)에서 영상 ID 대량 추출
    function onYouTubeIframeAPIReady() {
      extractorPlayer = new YT.Player('hiddenExtractor', {
        height: '1',
        width: '1',
        playerVars: {
          listType: 'playlist',
          list: EGG_UPLOADS_PLAYLIST_ID,
          autoplay: 0,
          controls: 0
        },
        events: {
          onReady: (e) => {
            setTimeout(() => {
              try {
                const ids = e.target.getPlaylist() || [];
                if (ids.length > 0) {
                  extractedChannelIds = ids;
                  loadMoreFromChannel(18); // 첫 화면에 최신 업로드 18개 자동 채우기
                }
              } catch (err) {}
            }, 1200);
          }
        }
      });
    }

    // 채널 플레이리스트에서 다음 영상들을 oEmbed 제목과 함께 불러와 그리드 카드로 추가
    async function loadMoreFromChannel(batchSize = 12) {
      const btn = document.getElementById('loadMoreBtn');
      btn.textContent = '⏳ 에그박사 채널에서 영상 불러오는 중...';

      const slice = extractedChannelIds.slice(loadCursor, loadCursor + batchSize);
      loadCursor += slice.length;

      for (const vid of slice) {
        if (!videoList.some(v => v.id === vid)) {
          let title = '에그박사 생물 탐사 에피소드';
          try {
            const resp = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vid}`);
            const meta = await resp.json();
            if (meta && meta.title) title = meta.title;
          } catch (e) {}
          const info = detectCategoryAndBadge(title);
          videoList.push({
            id: vid,
            title: title,
            category: info.category,
            badge: info.badge,
            date: '최신순'
          });
        }
      }

      localStorage.setItem(STORAGE_VIDEOS_KEY, JSON.stringify(videoList));
      document.getElementById('syncBadge').textContent = `채널 ${videoList.length}편 로드됨`;
      btn.textContent = '+ 이 재생목록의 다음 에그박사 영상 더 불러오기';
      renderTabs();
      renderGrid();
    }

    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    }

    function renderTabs() {
      const container = document.getElementById('playlistTabs');
      container.innerHTML = PLAYLIST_TABS.map(tab => {
        let count = 0;
        if (tab.id === 'latest') count = videoList.length;
        else if (tab.id === 'resume') count = Object.keys(watchProgress).filter(id => watchProgress[id]?.time > 5).length;
        else if (tab.id === 'fav') count = favorites.length;
        else count = videoList.filter(v => v.category === tab.id).length;

        const active = currentTab === tab.id;
        return `
          <button onclick="selectTab('${tab.id}')"
            class="flex items-center gap-1 px-3 py-1.5 rounded-xl font-bold text-xs sm:text-sm whitespace-nowrap transition ${
              active
                ? 'bg-lime-400 text-emerald-950 shadow-md scale-[1.02]'
                : 'bg-emerald-900/80 text-emerald-100 hover:bg-emerald-800'
            }">
            <span>${tab.icon}</span>
            <span>${tab.name}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-full ${active ? 'bg-emerald-950/20 text-emerald-950' : 'bg-emerald-800 text-lime-300'}">${count}</span>
          </button>
        `;
      }).join('');
    }

    function selectTab(tabId) {
      currentTab = tabId;
      renderTabs();
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('videoGrid');
      let list = videoList;

      if (currentTab === 'resume') {
        list = videoList.filter(v => (watchProgress[v.id]?.time || 0) > 5);
      } else if (currentTab === 'fav') {
        list = videoList.filter(v => favorites.includes(v.id));
      } else if (currentTab !== 'latest') {
        list = videoList.filter(v => v.category === currentTab);
      }

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-14 text-center text-emerald-300/80 text-sm">
            아직 표시할 영상이 없습니다. 아래 [더 불러오기] 또는 상단 [+ 영상 추가]를 눌러보세요!
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(video => {
        const prog = watchProgress[video.id];
        const savedSec = prog ? Math.floor(prog.time || 0) : 0;
        const duration = prog?.duration || 600;
        const percent = savedSec > 5 ? Math.min(95, Math.round((savedSec / duration) * 100)) : 0;
        const isFav = favorites.includes(video.id);

        return `
          <div onclick="openPlayer('${video.id}')"
            class="card-zoom cursor-pointer group bg-[#113023] rounded-xl overflow-hidden border border-emerald-800/90 hover:border-lime-400 transition shadow-md flex flex-col">
            <div class="relative aspect-video bg-black overflow-hidden">
              <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg"
                   alt="${video.title}"
                   loading="lazy"
                   class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
              <span class="absolute top-1.5 left-1.5 bg-black/75 backdrop-blur px-1.5 py-0.5 rounded text-[10px] sm:text-xs font-bold text-lime-300">
                ${video.badge || '🪲 에그박사'}
              </span>
              ${isFav ? `<span class="absolute top-1.5 right-1.5 text-xs bg-black/70 px-1.5 py-0.5 rounded">⭐</span>` : ''}
              ${savedSec > 5 ? `
                <span class="absolute bottom-2 right-1.5 bg-lime-400 text-emerald-950 text-[10px] font-extrabold px-1.5 py-0.5 rounded shadow">
                  ⏱️ ${formatTime(savedSec)} 이어보기
                </span>
                <div class="absolute bottom-0 left-0 right-0 h-1 bg-emerald-950">
                  <div class="h-full bg-lime-400" style="width:${percent}%"></div>
                </div>
              ` : ''}
            </div>
            <div class="p-2 flex-1 flex flex-col justify-between">
              <h3 class="text-xs sm:text-sm font-bold text-emerald-50 line-clamp-2 leading-snug">${video.title}</h3>
            </div>
          </div>
        `;
      }).join('');
    }

    function cycleGridCols() {
      const grid = document.getElementById('videoGrid');
      const btn = document.getElementById('gridToggleBtn');
      grid.classList.remove('grid-cols-2', 'grid-cols-3', 'grid-cols-4');
      gridCols = gridCols === 3 ? 4 : gridCols === 4 ? 2 : 3;
      grid.classList.add(`grid-cols-${gridCols}`);
      btn.textContent = `${gridCols}열`;
    }

    // 단편 재생 및 멈춘 위치 이어보기
    function openPlayer(videoId, forceStartZero = false) {
      currentVideo = videoList.find(v => v.id === videoId) || { id: videoId, title: '에그박사 생물도감', badge: '🪲 에그박사' };
      document.getElementById('modalTitle').textContent = currentVideo.title;
      document.getElementById('modalBadge').textContent = currentVideo.badge || '🪲 에그박사';
      document.getElementById('playerModal').classList.remove('hidden');
      updateFavBtnUI();

      const savedSec = forceStartZero ? 0 : Math.floor(watchProgress[videoId]?.time || 0);
      document.getElementById('resumeStatusText').textContent =
        savedSec > 5 ? `⏱️ 이전에 보던 ${formatTime(savedSec)} 위치부터 바로 이어서 재생합니다.` : `💡 보다가 닫아도 다음에 멈춘 위치부터 바로 이어서 재생됩니다.`;

      if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
        ytPlayer.loadVideoById({ videoId: videoId, startSeconds: savedSec });
      } else if (window.YT && window.YT.Player) {
        ytPlayer = new YT.Player('ytPlayerContainer', {
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            rel: 0,
            playsinline: 1,
            start: savedSec
          },
          events: {
            onStateChange: onPlayerStateChange
          }
        });
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        clearInterval(progressTimer);
        progressTimer = setInterval(saveCurrentTimestamp, 2000);
      } else {
        saveCurrentTimestamp();
        clearInterval(progressTimer);
        if (event.data === YT.PlayerState.ENDED && currentVideo) {
          delete watchProgress[currentVideo.id];
          localStorage.setItem(STORAGE_PROGRESS_KEY, JSON.stringify(watchProgress));
          renderTabs();
          renderGrid();
        }
      }
    }

    function saveCurrentTimestamp() {
      if (!ytPlayer || !currentVideo || typeof ytPlayer.getCurrentTime !== 'function') return;
      const cur = ytPlayer.getCurrentTime();
      const dur = ytPlayer.getDuration() || 600;
      if (cur > 3) {
        watchProgress[currentVideo.id] = { time: cur, duration: dur, updatedAt: Date.now() };
        localStorage.setItem(STORAGE_PROGRESS_KEY, JSON.stringify(watchProgress));
        localStorage.setItem(STORAGE_LAST_KEY, JSON.stringify({
          id: currentVideo.id,
          title: currentVideo.title,
          time: cur
        }));
        updateLastWatchedBanner();
      }
    }

    function restartCurrentVideo() {
      if (!currentVideo) return;
      delete watchProgress[currentVideo.id];
      localStorage.setItem(STORAGE_PROGRESS_KEY, JSON.stringify(watchProgress));
      openPlayer(currentVideo.id, true);
    }

    function closePlayerModal() {
      saveCurrentTimestamp();
      clearInterval(progressTimer);
      if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
        ytPlayer.pauseVideo();
      }
      document.getElementById('playerModal').classList.add('hidden');
      renderTabs();
      renderGrid();
    }

    function updateLastWatchedBanner() {
      const last = JSON.parse(localStorage.getItem(STORAGE_LAST_KEY) || 'null');
      const banner = document.getElementById('lastWatchedBanner');
      if (!last || !last.id) {
        banner.classList.add('hidden');
        return;
      }
      banner.classList.remove('hidden');
      document.getElementById('lastWatchedThumb').src = `https://img.youtube.com/vi/${last.id}/hqdefault.jpg`;
      document.getElementById('lastWatchedTitle').textContent = last.title;
      document.getElementById('lastWatchedTime').textContent = formatTime(last.time);
    }

    function resumeLastWatched() {
      const last = JSON.parse(localStorage.getItem(STORAGE_LAST_KEY) || 'null');
      if (last && last.id) openPlayer(last.id);
    }

    function toggleFavoriteCurrent() {
      if (!currentVideo) return;
      const idx = favorites.indexOf(currentVideo.id);
      if (idx >= 0) favorites.splice(idx, 1);
      else favorites.push(currentVideo.id);
      localStorage.setItem(STORAGE_FAV_KEY, JSON.stringify(favorites));
      updateFavBtnUI();
      renderTabs();
      renderGrid();
    }

    function updateFavBtnUI() {
      const btn = document.getElementById('modalFavBtn');
      const isFav = currentVideo && favorites.includes(currentVideo.id);
      btn.textContent = isFav ? '⭐ 찜 완료' : '☆ 찜하기';
      btn.className = isFav ? 'text-sm font-bold text-lime-400' : 'text-sm font-bold text-emerald-200';
    }

    function openAddVideoModal() {
      document.getElementById('addVideoModal').classList.remove('hidden');
    }
    function closeAddVideoModal() {
      document.getElementById('addVideoModal').classList.add('hidden');
    }
    function extractYoutubeId(input) {
      input = (input || '').trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      const m = input.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }
    async function saveNewVideo() {
      const cat = document.getElementById('newVideoCategory').value;
      let title = document.getElementById('newVideoTitle').value.trim();
      const vid = extractYoutubeId(document.getElementById('newVideoUrl').value);
      if (!vid) {
        alert('올바른 유튜브 주소나 11자리 영상 ID를 입력해 주세요.');
        return;
      }
      if (!title) {
        try {
          const r = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vid}`);
          const d = await r.json();
          title = d.title || '에그박사 새로운 탐사 영상';
        } catch (e) {
          title = '에그박사 새로운 탐사 영상';
        }
      }
      const badgeMap = {
        insect: '🪲 곤충·절지류',
        reptile: '🦎 파충류·양서류',
        aquatic: '🦀 수생·바다',
        explore: '🌿 자연탐사',
        lab: '🔬 관찰·실험'
      };
      videoList.unshift({
        id: vid,
        title: title,
        category: cat,
        badge: badgeMap[cat] || '🪲 에그박사',
        date: new Date().toISOString().slice(0, 10)
      });
      localStorage.setItem(STORAGE_VIDEOS_KEY, JSON.stringify(videoList));
      document.getElementById('newVideoTitle').value = '';
      document.getElementById('newVideoUrl').value = '';
      closeAddVideoModal();
      renderTabs();
      renderGrid();
    }

    // 초기 실행
    renderTabs();
    renderGrid();
    updateLastWatchedBanner();
    syncEggbugsLatestRSS();
  </script>
</body>
</html>
